services:
  db:
    image: postgres:17-alpine
    container_name: native-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: native
    ports:
      - "5432:5432"
    volumes:
      - native-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d native"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  native-db-data:
