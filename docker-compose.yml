services:
  db:
    image: postgres:17-alpine
    container_name: editora-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: editora
    ports:
      - "5432:5432"
    volumes:
      - editora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d editora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  editora-db-data:
